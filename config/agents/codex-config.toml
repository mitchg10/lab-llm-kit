# managed-by: lab-llm-kit — regenerated by `lab-sync` (a backup is kept if you edited it).
# Edit the template at $LAB_KIT/config/agents/codex-config.toml instead.
#
#   codex                      -> local Ollama (default; data stays on this Mac)
#   codex --profile lmstudio   -> LM Studio server (start it first: `lms server start`)
#   codex --profile cornell    -> Cornell AI Gateway (run `lab-key` first)

model = "__LAB_AGENT_MODEL__"
model_provider = "ollama-lab"

[history]
persistence = "none"          # shared account: don't keep a global prompt history

[model_providers.ollama-lab]
name = "Ollama (this Mac)"
base_url = "http://127.0.0.1:11434/v1"
wire_api = "responses"

[model_providers.lmstudio-lab]
name = "LM Studio (this Mac)"
base_url = "http://127.0.0.1:1234/v1"
wire_api = "responses"

[model_providers.cornell]
name = "Cornell AI Gateway"
base_url = "__CORNELL_AI_BASE_URL__"
env_key = "CORNELL_AI_API_KEY"
wire_api = "responses"

[profiles.local]
model = "__LAB_AGENT_MODEL__"
model_provider = "ollama-lab"

[profiles.lmstudio]
model = "__LMSTUDIO_AGENT_MODEL__"
model_provider = "lmstudio-lab"

[profiles.cornell]
model = "__CORNELL_AGENT_MODEL__"
model_provider = "cornell"
