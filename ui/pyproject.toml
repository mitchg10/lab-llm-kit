[project]
name = "lab-ui"
version = "0.1.0"
description = "Point-and-click front end for the lab kit: sign in, create projects, open notebooks, save to GitHub."
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_ui"]
