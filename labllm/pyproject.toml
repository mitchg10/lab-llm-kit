[project]
name = "labllm"
version = "0.2.0"
description = "One small API for the lab's local models (Ollama, LM Studio) and the Cornell AI Gateway: your prompts, unchanged, with an identifier check and reproducibility logging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openai>=1.40"]

[project.scripts]
labllm = "labllm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labllm"]
